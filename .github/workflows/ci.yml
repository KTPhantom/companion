name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # Tests use in-memory SQLite; these only satisfy import-time config.
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "ci-test-secret"
          ALGORITHM: "HS256"
        run: uv run pytest tests/ -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Migrations match models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: companion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Catches the case where someone changes a model but forgets the
      # migration — the schema and the code would silently diverge.
      - name: Apply migrations and check for drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/companion_test
          SECRET_KEY: "ci-test-secret"
          ALGORITHM: "HS256"
        run: |
          uv run alembic upgrade head
          uv run alembic check
